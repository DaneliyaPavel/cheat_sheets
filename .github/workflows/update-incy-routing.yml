name: Update INCY routing

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh routing profile
        run: python vpn/update_incy_routing.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- vpn/incy-routing-v3.json; then
            echo "No routing updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vpn/incy-routing-v3.json
          git commit -m "chore: refresh INCY routing"
          git push
